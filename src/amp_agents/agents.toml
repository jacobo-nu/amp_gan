# Configuración de agentes. La definición de cada agente está en context/agents/<nombre>.md y es la
# misma para cualquier modelo; aquí solo se elige proveedor, modelo y permisos.
#
# provider:
#   "ollama"        API nativa de Ollama (POST {base_url}/api/chat). Se usa por defecto porque permite fijar
#                   el contexto (options.num_ctx); el endpoint /v1 de Ollama lo fija en 4096 y recorta el
#                   historial en silencio.
#   "ollama_openai" Ollama por su endpoint compatible con OpenAI (base_url con /v1; sin control de contexto).
#   "openai_compat" | "llamacpp" | "vllm"   cualquier endpoint compatible con OpenAI
#                   (POST {base_url}/chat/completions).
# Si un servidor pide clave, indica el NOMBRE de una variable de entorno en api_key_env (nunca la clave aquí).

[agents.executor]
provider = "ollama"
model = "qwen3:4b"
base_url = "http://localhost:11434"
timeout = 600          # segundos máximos (de reloj) de cada petición al modelo; al vencer se cancela
max_steps = 25
max_seconds = 900      # tiempo total de la ejecución; cancela también la petición en curso
max_tokens = 8192      # tope de tokens por respuesta, razonamiento incluido (num_predict en Ollama)
tools = ["list_dir", "read_file", "grep", "write_file", "edit_file", "run_pytest"]
read = ["context", "src"]
write = ["src"]
allow_write_processed = false   # true permitiría escribir en context/data/processed/
max_file_bytes = 200000
pytest_timeout = 300

[agents.executor.options]       # opciones del modelo (en "ollama": options de Ollama; en otros: campos del cuerpo)
num_ctx = 12288                 # contexto (el prompt de sistema + herramientas ya ocupan ~2000 tokens)
temperature = 0.2

# --- Roles acotados (solo lectura o de una pasada) -----------------------------------------------------
# mode:
#   "agent"        bucle con herramientas (solo las de `tools`; `write = []` = ninguna raíz de escritura)
#   "single_shot"  una petición sin herramientas, con límite de tiempo (max_seconds) y de tokens (max_tokens)
#   "embedding"    modelo de embeddings: no genera texto (indexa y busca; ver amp_agents.retrieval)
# verifier: nombre de la comprobación automática de la salida (amp_agents.verifiers). La salida de estos roles
# no se da por buena sin pasar por ella.
# search_docs (herramienta de solo lectura) se puede añadir a `tools` de cualquier rol de modo agent; por defecto
# ningún rol la tiene. search_backend = "lexical" (BM25 sin modelo ni índice; es el valor POR DEFECTO, también para el
# rol retriever y para search_docs) o "embedding" (opción explícita: usa el índice y el modelo del rol retriever; en la
# evaluación en vivo puntuó por debajo de BM25, 60 % frente a 73 % en el top-3).

# RETIRADO: el localizador con modelo (llama3.2:3b) acertó el 10 % en la evaluación en vivo y lo que hace es `grep`.
# La función determinista amp_agents.locate.locate() lo sustituye. Esta sección y su evaluación (eval_roles locator, o
# `all --roles locator`) se conservan solo para reproducir el resultado negativo; `all` ya no lo incluye.
[agents.locator]
mode = "agent"
provider = "ollama"
model = "llama3.2:3b"
base_url = "http://localhost:11434"
timeout = 120
max_steps = 12
max_seconds = 180
max_tokens = 1024
tools = ["list_dir", "grep", "read_file"]
read = ["src", "context"]
write = []
verifier = "locator"

[agents.locator.options]
num_ctx = 8192
temperature = 0.2

[agents.doc_checker]
mode = "agent"
provider = "ollama"
model = "phi4-mini"
base_url = "http://localhost:11434"
timeout = 240
max_steps = 12
max_seconds = 300
max_tokens = 2048
tools = ["read_file", "grep", "list_dir"]
read = ["context", "src"]
write = []
verifier = "doc_checker"

[agents.doc_checker.options]
num_ctx = 12288
temperature = 0.2

[agents.code_reviewer]
mode = "agent"
provider = "ollama"
model = "qwen2.5-coder:7b"
base_url = "http://localhost:11434"
timeout = 300
max_steps = 10
max_seconds = 420
max_tokens = 2048
tools = ["read_file", "grep", "list_dir"]
read = ["src", "context"]
write = []
verifier = "code_reviewer"

[agents.code_reviewer.options]
num_ctx = 8192
temperature = 0.2

[agents.summarizer]
mode = "single_shot"
provider = "ollama"
model = "gemma3:4b"
base_url = "http://localhost:11434"
timeout = 180
max_seconds = 180
max_tokens = 700
tools = []
read = ["context"]
write = []
verifier = "summarizer"

[agents.summarizer.options]
num_ctx = 8192
temperature = 0.2

[agents.retriever]
mode = "embedding"
provider = "ollama"
model = "nomic-embed-text"
base_url = "http://localhost:11434"
timeout = 120
max_seconds = 600
max_tokens = 0
tools = []
read = ["context", "src"]
write = []                      # solo escribe el índice, en index_dir (fuera del control de versiones)
index_dir = ".agent_runs/index"
search_backend = "lexical"      # BM25 por defecto; "embedding" (nomic-embed-text y el índice de index_dir) solo si se pide
verifier = "retriever"

[agents.retriever.options]
num_ctx = 2048

