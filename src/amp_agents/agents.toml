# Configuración de agentes. La definición de cada agente está en context/agents/<nombre>.md y es la
# misma para cualquier modelo; aquí solo se elige proveedor, modelo y permisos.
#
# provider:
#   "ollama"        API nativa de Ollama (POST {base_url}/api/chat). Se usa por defecto porque permite fijar
#                   el contexto (options.num_ctx); el endpoint /v1 de Ollama lo fija en 4096 y recorta el
#                   historial en silencio.
#   "ollama_openai" Ollama por su endpoint compatible con OpenAI (base_url con /v1; sin control de contexto).
#   "ollama_systemone"  modelos de DECISIÓN de Ollama (p. ej. tev1): no generan texto; POST {base_url}/v1/systemone devuelve una
#                   probabilidad por pregunta (solo la usa amp_agents.pairs; ver su docstring).
#   "openai_compat" | "llamacpp" | "vllm"   cualquier endpoint compatible con OpenAI
#                   (POST {base_url}/chat/completions).
# Si un servidor pide clave, indica el NOMBRE de una variable de entorno en api_key_env (nunca la clave aquí).

[agents.executor]
provider = "ollama"
model = "qwen3:4b"
base_url = "http://localhost:11434"
timeout = 600          # segundos máximos (de reloj) de cada petición al modelo; al vencer se cancela
max_steps = 25
max_seconds = 900      # tiempo total de la ejecución; cancela también la petición en curso
max_tokens = 8192      # tope de tokens por respuesta, razonamiento incluido (num_predict en Ollama)
tools = ["list_dir", "read_file", "grep", "write_file", "edit_file", "run_pytest"]
read = ["context", "src"]
write = ["src"]
allow_write_processed = false   # true permitiría escribir en context/data/processed/
max_file_bytes = 200000
pytest_timeout = 300

[agents.executor.options]       # opciones del modelo (en "ollama": options de Ollama; en otros: campos del cuerpo)
num_ctx = 12288                 # contexto (el prompt de sistema + herramientas ya ocupan ~2000 tokens)
temperature = 0.2

# --- Roles acotados (solo lectura o de una pasada) -----------------------------------------------------
# mode:
#   "agent"        bucle con herramientas (solo las de `tools`; `write = []` = ninguna raíz de escritura)
#   "single_shot"  una petición sin herramientas, con límite de tiempo (max_seconds) y de tokens (max_tokens)
#   "embedding"    modelo de embeddings: no genera texto (indexa y busca; ver amp_agents.retrieval)
# verifier: nombre de la comprobación automática de la salida (amp_agents.verifiers). La salida de estos roles
# no se da por buena sin pasar por ella.
# search_docs (herramienta de solo lectura) se puede añadir a `tools` de cualquier rol de modo agent; por defecto
# ningún rol la tiene. search_backend = "lexical" (BM25 sin modelo ni índice; es el valor POR DEFECTO, también para el
# rol retriever y para search_docs) o "embedding" (opción explícita: usa el índice y el modelo del rol retriever; en la
# evaluación en vivo puntuó por debajo de BM25, 60 % frente a 73 % en el top-3) o "hybrid" (BM25 + embeddings por rango recíproco;
# ver el rol retriever_hybrid).

# RETIRADO: el localizador con modelo (llama3.2:3b) acertó el 10 % en la evaluación en vivo y lo que hace es `grep`.
# La función determinista amp_agents.locate.locate() lo sustituye. Esta sección y su evaluación (eval_roles locator, o
# `all --roles locator`) se conservan solo para reproducir el resultado negativo; `all` ya no lo incluye.
[agents.locator]
mode = "agent"
provider = "ollama"
model = "llama3.2:3b"
base_url = "http://localhost:11434"
timeout = 120
max_steps = 12
max_seconds = 180
max_tokens = 1024
tools = ["list_dir", "grep", "read_file"]
read = ["src", "context"]
write = []
verifier = "locator"

[agents.locator.options]
num_ctx = 8192
temperature = 0.2

[agents.doc_checker]
mode = "agent"
provider = "ollama"
model = "phi4-mini"
base_url = "http://localhost:11434"
timeout = 240
max_steps = 12
max_seconds = 300
max_tokens = 2048
tools = ["read_file", "grep", "list_dir"]
read = ["context", "src"]
write = []
verifier = "doc_checker"

[agents.doc_checker.options]
num_ctx = 12288
temperature = 0.2

# Variante de una pasada de doc_checker, para comparar con él (que queda intacto): mismo modelo, mismo formato JSON y
# mismos verificadores de citas, pero sin herramientas; los dos documentos, con numeración de línea, van en el mensaje de
# usuario (amp_agents.run.prepare_task). Los documentos congelados de la evaluación (~14,6 mil caracteres, unos 5000
# tokens) más la definición y la gobernanza caben de sobra en num_ctx = 12288 junto con los 2048 tokens de salida.
# Si falta context/agents/doc_checker_ss.md se usa la definición de doc_checker (definition_fallback).
[agents.doc_checker_ss]
mode = "single_shot"
provider = "ollama"
model = "phi4-mini"
base_url = "http://localhost:11434"
timeout = 240
max_seconds = 300
max_tokens = 2048
tools = []
read = ["context", "src"]
write = []
verifier = "doc_checker"
definition_fallback = "doc_checker"

[agents.doc_checker_ss.options]
num_ctx = 12288
temperature = 0.2

# Versión ACOTADA del verificador documental (amp_agents.pairs): el código propone pares de líneas (una de cada documento) y
# el modelo solo juzga cada par, sin herramientas y con una petición por par, con `{"contradiccion": true|false}`; las citas
# del hallazgo las copia el código del documento. El mensaje de sistema es fijo y vive en amp_agents.pairs
# (PAIR_SYSTEM_PROMPT; no lleva la gobernanza, para gastar poco contexto); `definition_fallback` solo sirve si algún día se
# ensambla el prompt con build_system_prompt. Mismos criterios que doc_checker. Cada petición tiene su tope de tiempo
# (max_seconds y timeout) y de tokens (max_tokens, razonamiento incluido; los modelos de razonamiento necesitan mucho más:
# `eval_roles --max-tokens`). num_ctx pequeño: un par de líneas y el mensaje de sistema caben de sobra en 2048.
[agents.doc_checker_pairs]
mode = "single_shot"
provider = "ollama"
model = "gemma3:4b"
base_url = "http://localhost:11434"
timeout = 60
max_seconds = 60
max_tokens = 96
tools = []
read = ["context", "src"]
write = []
verifier = "doc_checker"
definition_fallback = "doc_checker_ss"

[agents.doc_checker_pairs.options]
num_ctx = 2048
temperature = 0.2

# Variantes de doc_checker_pairs declaradas el 2026-11-06 (ver el punto 8 del docstring de amp_agents.pairs; mismos criterios):
# - doc_checker_pairs_short: modelo de decisión tev1 con el estado corto «A: ...\nB: ...» (solo cambia el formato del estado).
# - doc_checker_pairs_json: gemma3:4b con salida restringida (`format` de Ollama, esquema {"contradiccion": boolean}), max_tokens 24.
# - doc_checker_pairs_agree: gemma3:4b con dos preguntas (P1 «¿se contradicen?», P2 «¿pueden ser verdaderas las dos a la vez?»);
#   contradicción solo si P1 = sí y P2 = no. El esquema de `format` de la configuración es el de P1; el de P2 lo pone el código.
[agents.doc_checker_pairs_short]
mode = "single_shot"
provider = "ollama_systemone"
model = "tev1:4b-q4_K_M"
base_url = "http://localhost:11434"
timeout = 60
max_seconds = 60
max_tokens = 96
tools = []
read = ["context", "src"]
write = []
verifier = "doc_checker"
definition_fallback = "doc_checker_ss"

[agents.doc_checker_pairs_short.options]
num_ctx = 8192

[agents.doc_checker_pairs_json]
mode = "single_shot"
provider = "ollama"
model = "gemma3:4b"
base_url = "http://localhost:11434"
timeout = 60
max_seconds = 60
max_tokens = 24
tools = []
read = ["context", "src"]
write = []
verifier = "doc_checker"
definition_fallback = "doc_checker_ss"

[agents.doc_checker_pairs_json.options]
num_ctx = 2048
temperature = 0.2
format = { type = "object", properties = { contradiccion = { type = "boolean" } }, required = ["contradiccion"] }

[agents.doc_checker_pairs_agree]
mode = "single_shot"
provider = "ollama"
model = "gemma3:4b"
base_url = "http://localhost:11434"
timeout = 60
max_seconds = 60
max_tokens = 24
tools = []
read = ["context", "src"]
write = []
verifier = "doc_checker"
definition_fallback = "doc_checker_ss"

[agents.doc_checker_pairs_agree.options]
num_ctx = 2048
temperature = 0.2
format = { type = "object", properties = { contradiccion = { type = "boolean" } }, required = ["contradiccion"] }

[agents.code_reviewer]
mode = "agent"
provider = "ollama"
model = "qwen2.5-coder:7b"
base_url = "http://localhost:11434"
timeout = 300
max_steps = 10
max_seconds = 420
max_tokens = 2048
tools = ["read_file", "grep", "list_dir"]
read = ["src", "context"]
write = []
verifier = "code_reviewer"

[agents.code_reviewer.options]
num_ctx = 8192
temperature = 0.2

# Revisor ACOTADO por función y por tipo de defecto (amp_agents.func_review, diseño fijado el 2026-11-06): el código divide el
# fichero con `ast` y hace UNA petición sin herramientas por función y categoría (5), con salida restringida (`format`; esquema
# REVIEW_FORMAT_SCHEMA de amp_agents.func_review, {"defecto": boolean, "linea": integer}); la cita la copia el código de la
# línea indicada. El mensaje de sistema es fijo y vive en amp_agents.func_review (REVIEW_SYSTEM_PROMPT); `definition_fallback` solo
# sirve si algún día se ensambla el prompt con build_system_prompt. Mismos criterios que code_reviewer. Variantes de modelo con
# `eval_roles code_reviewer_funcs --model ...` (qwen2.5-coder:7b por defecto; gemma3:4b; phi4-mini). num_ctx pequeño: una función de
# hasta 40 líneas con su numeración y el mensaje de sistema caben de sobra en 2048 (se mide en la evaluación: prompt máximo).
[agents.code_reviewer_funcs]
mode = "single_shot"
provider = "ollama"
model = "qwen2.5-coder:7b"
base_url = "http://localhost:11434"
timeout = 60
max_seconds = 60
max_tokens = 32
tools = []
read = ["src", "context"]
write = []
verifier = "code_reviewer"
definition_fallback = "code_reviewer"

[agents.code_reviewer_funcs.options]
num_ctx = 2048
temperature = 0.2
format = { type = "object", properties = { defecto = { type = "boolean" }, linea = { type = "integer" } }, required = ["defecto", "linea"] }

[agents.summarizer]
mode = "single_shot"
provider = "ollama"
model = "gemma3:4b"
base_url = "http://localhost:11434"
timeout = 180
max_seconds = 180
max_tokens = 700
tools = []
read = ["context"]
write = []
verifier = "summarizer"

[agents.summarizer.options]
num_ctx = 8192
temperature = 0.2

[agents.retriever]
mode = "embedding"
provider = "ollama"
model = "nomic-embed-text"
base_url = "http://localhost:11434"
timeout = 120
max_seconds = 600
max_tokens = 0
tools = []
read = ["context", "src"]
write = []                      # solo escribe el índice, en index_dir (fuera del control de versiones)
index_dir = ".agent_runs/index"
search_backend = "lexical"      # BM25 por defecto; "embedding" (nomic-embed-text y el índice de index_dir) solo si se pide
verifier = "retriever"

[agents.retriever.options]
num_ctx = 2048

# Recuperador HÍBRIDO (amp_agents.retrieval, diseño fijado el 2026-11-06): BM25 + embeddings fusionados por rango recíproco (RRF, k = 60,
# pesos iguales, listas completas). Mismo troceado, mismo índice (que guarda el modelo y no se reutiliza entre modelos) y mismo
# criterio que `retriever`. El modelo por defecto es nomic-embed-text; `eval_roles retriever_hybrid --model bge-m3` prueba el otro.
# `bge-m3` no usa prefijos de tarea (los de nomic dependen del modelo: retrieval.prefixes_for).
[agents.retriever_hybrid]
mode = "embedding"
provider = "ollama"
model = "nomic-embed-text"
base_url = "http://localhost:11434"
timeout = 120
max_seconds = 600
max_tokens = 0
tools = []
read = ["context", "src"]
write = []
index_dir = ".agent_runs/index"
search_backend = "hybrid"
verifier = "retriever"
definition_fallback = "retriever"

[agents.retriever_hybrid.options]
num_ctx = 2048

